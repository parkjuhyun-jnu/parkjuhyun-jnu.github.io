<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 | 박주현</title>
<meta name="description" content="박주현 부교수의 강의 과목과 학기별 강의 이력 — 과목 안내, 결과물 제출과 갤러리.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Cpath d='M9 8h6.2c.9 0 1.8.7 1.8 1.7V24c0-.9-.8-1.6-1.8-1.6H9z' fill='%23fbfaf6'/%3E%3Cpath d='M23 8h-6.2c-.9 0-1.8.7-1.8 1.7V24c0-.9.8-1.6 1.8-1.6H23z' fill='%23a8742f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="index.html">박주현<small>전남대학교 문헌정보학과</small></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="메뉴 열기">☰</button>
    <nav class="nav" id="nav">
      <a href="about.html">소개</a>
      <a href="research.html">연구</a>
      <a href="courses.html">수업</a>
      <a href="gallery.html">결과물</a>
      <a href="surveys.html">설문</a>
      <button class="theme-toggle" type="button"></button>
    </nav>
  </div>
</header>

<main>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow">TEACHING</p>
      <h1 style="font-family:var(--font-serif)">수업</h1>
      <p style="max-width:58ch; font-size:1.05rem; color:var(--ink-soft)">
        이번 학기 과목과, 부임 이후 가르친 모든 과목의 기록입니다.
        결과물을 올릴 때는 담당 교수가 알려 준 <strong>수업 코드</strong>가 필요합니다.
      </p>

      <div class="grid" id="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-top:2rem">
        <p class="muted">불러오는 중…</p>
      </div>
      <p class="small muted" id="stats-note" style="margin-top:.7rem"></p>

      <div class="row" style="margin-top:1.6rem">
        <a class="btn" href="upload.html">결과물 올리기</a>
        <a class="btn btn--ghost" href="gallery.html">공개 갤러리 보기</a>
      </div>
    </div>
  </section>

  <!-- 이번 학기 -->
  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="section-head">
        <h2 id="current-title">이번 학기</h2>
        <p id="current-sub"></p>
      </div>
      <div class="grid grid-2" id="current-list">
        <p class="muted">불러오는 중…</p>
      </div>
    </div>
  </section>

  <!-- 강의 이력 -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">HISTORY</p>
        <h2>학기별 강의 이력</h2>
        <p>왼쪽이 1학기, 오른쪽이 2학기입니다. 최근 두 해만 펼쳐 두었습니다.</p>
      </div>
      <div class="years" id="history"></div>
      <div id="history-more-row" style="display:none; margin-top:1.1rem">
        <button class="btn btn--ghost btn--sm" type="button"
                id="history-toggle" aria-controls="history" aria-expanded="false"></button>
      </div>
      <p class="small muted" id="history-note" style="margin-top:1.2rem"></p>
    </div>
  </section>

  <!-- 과목별 누적 -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2>과목별 누적</h2>
        <p id="rank-sub">같은 과목을 몇 학기 동안 가르쳤는지입니다.</p>
      </div>
      <ul class="tally" id="rank"></ul>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/settings.js"></script>
<script>
(function () {
  const LEVEL_CLASS = { '학부': 'ug', '대학원': 'grad', '교양': 'ge' };
  const levelTag = (lv) => `<span class="tag tag--${LEVEL_CLASS[lv] || 'ug'}">${esc(lv)}</span>`;

  // 수강생 수 공개 여부는 관리 페이지에서 켜고 끕니다. 기본은 숨김입니다.
  let showN = false;

  Promise.all([
    fetch('data/teaching.json').then((r) => r.json()),
    fetch('data/courses.json').then((r) => r.json()).catch(() => ({ courses: [] })),
    readSetting('showEnrollment', false),
  ])
    .then(([teaching, cData, setting]) => {
      showN = setting === true;
      const details = cData.courses || [];
      renderStats(teaching.summary);
      renderCurrent(teaching.semesters[0], details);
      renderHistory(teaching);
      renderRank(teaching.byCourse);
    })
    .catch((err) => {
      document.getElementById('current-list').innerHTML =
        `<p class="muted">수업 정보를 불러오지 못했습니다. (${esc(err.message || err)})</p>`;
      document.getElementById('stats').innerHTML = '';
    });

  function statCard(n, label) {
    return `<div class="card card--flat" style="text-align:center">
      <div style="font-size:1.8rem; font-weight:700; color:var(--navy)">${esc(n)}</div>
      <div class="small muted">${esc(label)}</div>
    </div>`;
  }

  function renderStats(s) {
    const cards = [
      statCard(s.semesterCount, '학기'),
      statCard(s.uniqueCourseCount, '서로 다른 과목'),
      statCard(s.openedCount, '개설 건수'),
    ];
    if (showN) cards.push(statCard(s.totalStudents, '누적 수강생'));
    document.getElementById('stats').innerHTML = cards.join('');
    document.getElementById('stats-note').textContent =
      `${s.firstSemester} ~ ${s.latestSemester} · 강의시간표 기준`;
  }

  /** 시간표의 과목에 courses.json 의 상세 안내를 붙입니다. */
  function detailFor(course, semesterId, details) {
    return details.find((d) =>
      d.code && d.code === course.code && (!d.semester || d.semester === semesterId)) || null;
  }

  function renderCurrent(sem, details) {
    if (!sem) return;
    document.getElementById('current-title').textContent = sem.label;
    document.getElementById('current-sub').textContent = showN
      ? `${sem.courseCount}과목 · 수강생 ${sem.students}명`
      : `${sem.courseCount}과목`;

    document.getElementById('current-list').innerHTML = sem.courses.map((c) => {
      const d = detailFor(c, sem.id, details);
      const links = d ? `
        <div class="course-card__links">
          <a class="btn btn--sm" href="course.html?id=${encodeURIComponent(d.id)}">과목 안내</a>
          <a class="btn btn--ghost btn--sm" href="gallery.html?course=${encodeURIComponent(d.id)}">결과물 갤러리</a>
          <a class="btn btn--ghost btn--sm" href="upload.html?course=${encodeURIComponent(d.id)}">제출하기</a>
        </div>` : '';

      return `<article class="card course-card">
        <div class="row" style="gap:.4rem">
          ${levelTag(c.level)}
          <span class="small muted">${esc(c.code)}${c.section ? '-' + esc(c.section) : ''}</span>
        </div>
        <h3 class="course-card__title">${esc(c.title)}</h3>
        <p class="small muted" style="margin:0">
          ${esc(c.when || '')}${c.room ? ' · ' + esc(c.room) : ''}
        </p>
        ${showN ? `<p class="small" style="margin:.2rem 0 0; color:var(--ink-soft)">수강 ${esc(c.enrolled ?? '-')}명</p>` : ''}
        ${d && d.summary ? `<p class="small" style="margin:.5rem 0 0; color:var(--ink-soft)">${esc(d.summary)}</p>` : ''}
        ${links}
      </article>`;
    }).join('');
  }

  function renderHistory(teaching) {
    // 연도별로 묶어 1학기·2학기를 나란히 놓습니다.
    const byYear = new Map();
    teaching.semesters.forEach((s) => {
      if (!byYear.has(s.year)) byYear.set(s.year, {});
      byYear.get(s.year)[s.term] = s;
    });

    const courseLine = (c) => `
      <li title="${esc(c.title)}${c.code ? ' · ' + esc(c.code) : ''}">
        ${levelTag(c.level)}
        <span class="term__name">${esc(c.title)}</span>
        ${c.lab ? '<span class="tag tag--lab">실습</span>' : ''}
        ${showN ? `<span class="term__n">${esc(c.enrolled ?? '-')}명</span>` : ''}
      </li>`;

    const termBlock = (sem, term) => {
      if (!sem) {
        return `<div class="term">
          <h4 class="term__label">${term}학기</h4>
          <p class="term--empty">강의 없음</p>
        </div>`;
      }
      return `<div class="term">
        <h4 class="term__label">${term}학기 <span>${esc(sem.courseCount)}과목${showN ? ` · ${esc(sem.students)}명` : ''}</span></h4>
        <ul class="term__list">${sem.courses.map(courseLine).join('')}</ul>
      </div>`;
    };

    // 최근 해와 직전 해만 펼쳐 두고, 나머지는 단추를 눌러야 보이게 합니다.
    const RECENT = 2;
    const years = [...byYear.keys()].sort((a, b) => b - a);
    document.getElementById('history').innerHTML = years.map((y, i) => `
      <div class="year${i >= RECENT ? ' year--hidden' : ''}">
        <div class="year__no">${esc(y)}</div>
        <div class="year__terms">
          ${termBlock(byYear.get(y)[1], 1)}
          ${termBlock(byYear.get(y)[2], 2)}
        </div>
      </div>`).join('');

    setupMore(years.slice(RECENT));

    document.getElementById('history-note').textContent =
      `강의시간표 ${teaching.semesters.length}건에서 자동으로 만든 기록입니다. (갱신 ${teaching['생성일'] || ''})`;
  }

  /** 접어 둔 지난 연도를 단추로 펼치고 접습니다. */
  function setupMore(hidden) {
    if (!hidden.length) return;
    const row = document.getElementById('history-more-row');
    const btn = document.getElementById('history-toggle');
    const box = document.getElementById('history');

    const span = hidden.length === 1
      ? `${hidden[0]}년`
      : `${hidden[hidden.length - 1]}–${hidden[0]}년`;
    const label = (open) => open
      ? '지난 이력 접기'
      : `지난 이력 더 보기 (${span} · ${hidden.length}개 연도)`;

    row.style.display = '';
    btn.textContent = label(false);
    btn.addEventListener('click', () => {
      const open = box.classList.toggle('years--all');
      btn.textContent = label(open);
      btn.setAttribute('aria-expanded', String(open));
    });
  }

  function renderRank(byCourse) {
    if (!byCourse || !byCourse.length) return;
    document.getElementById('rank-sub').textContent =
      `${byCourse.length}개 과목 · 같은 과목을 몇 학기 동안 가르쳤는지입니다.`;
    // 어느 학기에 열었는지는 위쪽 '학기별 강의 이력'에 이미 있어 여기서는 생략합니다.
    // 대신 줄에 마우스를 올리면 학기가 보입니다.
    document.getElementById('rank').innerHTML = byCourse.map((e) => `
      <li title="${esc(e.title)} — ${esc(e.semesters.join(', '))}">
        ${levelTag(e.level)}
        <span class="tally__name">${esc(e.title)}</span>
        ${showN ? `<span class="tally__students">${esc(e.students)}명</span>` : ''}
        <span class="tally__n">${esc(e.count)}<small>학기</small></span>
      </li>`).join('');
  }
})();
</script>
</body>
</html>
