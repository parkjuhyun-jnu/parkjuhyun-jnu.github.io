<header class="site-header">

      <p class="eyebrow">GALLERY</p>
      <h1 style="font-family:var(--font-serif)">결과물 갤러리</h1>
      <p style="max-width:58ch; font-size:1.05rem; color:var(--ink-soft)">
        수업에서 만든 보고서·발표자료·포스터·영상입니다. <strong>모두 공개</strong>로 올린 결과물은
        누구나 볼 수 있고, <strong>수업 공개</strong>로 올린 결과물은 수업 코드를 입력해야 보입니다.
      </p>

      <div id="demo-banner" style="margin-top:1.4rem; display:none">

          <button class="btn btn--ghost btn--sm" type="button" id="clear-demo" style="margin-top:.6rem">데모 자료 모두 지우기</button>
        </div>
      </div>
    </div>

        <select id="course-select" style="width:auto; min-width:240px">
          <option value="">전체 — 모두 공개된 결과물</option>
        </select>
        <a class="btn btn--sm" id="upload-link" href="upload.html">결과물 올리기</a>
        <button class="btn btn--ghost btn--sm" type="button" id="lock-btn" style="display:none">수업 코드 잠그기</button>

      <div class="gallery-grid" id="works"></div>

    </div>
