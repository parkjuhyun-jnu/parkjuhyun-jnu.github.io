<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 | 박주현</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Cpath d='M9 8h6.2c.9 0 1.8.7 1.8 1.7V24c0-.9-.8-1.6-1.8-1.6H9z' fill='%23fbfaf6'/%3E%3Cpath d='M23 8h-6.2c-.9 0-1.8.7-1.8 1.7V24c0-.9.8-1.6 1.8-1.6H23z' fill='%23a8742f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="index.html">박주현<small>전남대학교 문헌정보학과</small></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="메뉴 열기">☰</button>
    <nav class="nav" id="nav">
      <a href="about.html">소개</a>
      <a href="research.html">연구</a>
      <a href="courses.html">수업</a>
      <a href="media.html">미디어</a>
      <a href="gallery.html">결과물</a>
      <a href="surveys.html">설문</a>
      <button class="theme-toggle" type="button"></button>
    </nav>
  </div>
</header>

<main>
  <!-- 로그인 -->
  <section class="section" id="login-section">
    <div class="wrap">
      <div class="lock">
        <div class="lock__icon">🔑</div>
        <h1 style="font-size:1.3rem; font-family:var(--font-serif)">관리자 로그인</h1>
        <p class="small muted" id="login-hint"></p>
        <form id="login-form" style="margin-top:1.2rem; text-align:left">
          <div class="field">
            <label for="email">이메일</label>
            <input type="email" id="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" autocomplete="current-password" required>
          </div>
          <button class="btn" type="submit" style="width:100%">로그인</button>
          <p class="small" id="login-msg" style="margin:.8rem 0 0; min-height:1.2em"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- 관리 화면 -->
  <section class="section" id="admin-section" style="display:none">
    <div class="wrap">
      <div class="row" style="justify-content:space-between; align-items:flex-start">
        <div>
          <p class="eyebrow">ADMIN</p>
          <h1 style="font-family:var(--font-serif); margin-bottom:.2rem">제출물 관리</h1>
          <p class="muted small" id="who"></p>
        </div>
        <button class="btn btn--ghost btn--sm" type="button" id="logout">로그아웃</button>
      </div>

      <div class="grid grid-3" style="margin:1.8rem 0">
        <div class="card card--flat" style="text-align:center">
          <div style="font-size:1.9rem; font-weight:700; color:var(--navy)" id="stat-total">0</div>
          <div class="small muted">전체 제출물</div>
        </div>
        <div class="card card--flat" style="text-align:center">
          <div style="font-size:1.9rem; font-weight:700; color:var(--ok)" id="stat-public">0</div>
          <div class="small muted">모두 공개</div>
        </div>
        <div class="card card--flat" style="text-align:center">
          <div style="font-size:1.9rem; font-weight:700; color:var(--gold)" id="stat-class">0</div>
          <div class="small muted">수업 공개</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:1.8rem">
        <h3 style="font-size:1rem">사이트 설정</h3>
        <label class="radio-card" style="margin-top:.7rem; max-width:520px">
          <input type="checkbox" id="set-budget">
          <span><strong>연구 과제 사업비 금액 공개</strong>
            <span>끄면 연구 페이지에서 과제별 금액과 총 연구비가 사라집니다.
              과제명·기관·기간은 그대로 보입니다.</span></span>
        </label>
        <label class="radio-card" style="margin-top:.6rem; max-width:520px">
          <input type="checkbox" id="set-enroll">
          <span><strong>강의 이력의 수강생 수 공개</strong>
            <span>끄면 수업 페이지와 첫 화면에서 수강 인원과 누적 수강생 수가 사라집니다.
              과목명·시간·강의실·정원은 그대로 보입니다.</span></span>
        </label>
        <p class="small" id="set-msg" style="margin:.6rem 0 0; min-height:1.1em"></p>
      </div>

      <!-- 관리자 비밀번호 바꾸기 -->
      <div class="card" style="margin-bottom:1.8rem">
        <h3 style="font-size:1rem">관리자 비밀번호 바꾸기</h3>
        <p class="small muted" style="margin:.3rem 0 .9rem">
          다른 사이트에서 쓰지 않는 비밀번호로 정해 주세요. 8자 이상이어야 합니다.
          바꾼 뒤에도 지금 로그인은 그대로 유지됩니다.</p>
        <form id="pw-form" class="row" style="gap:.6rem; align-items:flex-end; max-width:620px">
          <!-- 비밀번호 관리자가 어느 계정의 비밀번호인지 알 수 있도록 넣어 둡니다 -->
          <input type="text" id="pw-user" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
          <div class="field" style="flex:1 1 180px; margin:0">
            <label for="new-pw">새 비밀번호</label>
            <input type="password" id="new-pw" autocomplete="new-password" minlength="8">
          </div>
          <div class="field" style="flex:1 1 180px; margin:0">
            <label for="new-pw2">한 번 더</label>
            <input type="password" id="new-pw2" autocomplete="new-password" minlength="8">
          </div>
          <button class="btn btn--sm" type="submit" style="flex:none">바꾸기</button>
        </form>
        <p class="small" id="pw-msg" style="margin:.6rem 0 0; min-height:1.1em"></p>
      </div>

      <!-- 소개 페이지 내용 편집 -->
      <div class="card" style="margin-bottom:1.8rem">
        <div class="row" style="justify-content:space-between; align-items:flex-start">
          <div>
            <h3 style="font-size:1rem; margin-bottom:.2rem">소개 페이지 — 수상 · 활동 · 자격</h3>
            <p class="small muted mb-0">고친 뒤 <strong>저장</strong>을 눌러야 반영됩니다.</p>
          </div>
          <div class="row" style="gap:.4rem">
            <button class="btn btn--ghost btn--sm" type="button" id="act-reset">되돌리기</button>
            <button class="btn btn--ghost btn--sm" type="button" id="act-download">JSON 내려받기</button>
            <button class="btn btn--sm" type="button" id="act-save">저장</button>
          </div>
        </div>
        <p class="small" id="act-msg" style="margin:.6rem 0 1.2rem; min-height:1.1em"></p>

        <div class="edit-group">
          <h4>수상 <span class="edit-group__count" id="cnt-awards"></span></h4>
          <div id="act-awards"></div>
          <button class="btn btn--ghost btn--sm" type="button" data-add="awards" style="margin-top:.6rem">+ 수상 추가</button>
        </div>

        <div class="edit-group">
          <h4>학회 활동 <span class="edit-group__count" id="cnt-societies"></span></h4>
          <div id="act-societies"></div>
          <button class="btn btn--ghost btn--sm" type="button" data-add="societies" style="margin-top:.6rem">+ 학회 추가</button>
        </div>

        <div class="edit-group">
          <h4>정부·공공기관 위원 <span class="edit-group__count" id="cnt-committees"></span></h4>
          <div id="act-committees"></div>
          <button class="btn btn--ghost btn--sm" type="button" data-add="committees" style="margin-top:.6rem">+ 위원 추가</button>
        </div>

        <div class="edit-group">
          <h4>자격 <span class="edit-group__count" id="cnt-certs"></span></h4>
          <p class="small muted" style="margin:0 0 .6rem">한 줄에 자격 하나씩 적으세요.</p>
          <div id="act-certs"></div>
          <button class="btn btn--ghost btn--sm" type="button" data-add="certifications" style="margin-top:.6rem">+ 묶음 추가</button>
        </div>
      </div>

      <div class="pub-toolbar">
        <label class="sr-only" for="filter-course">과목</label>
        <select id="filter-course" style="width:auto; min-width:220px">
          <option value="">전체 과목</option>
        </select>
        <label class="sr-only" for="filter-vis">공개 범위</label>
        <select id="filter-vis" style="width:auto">
          <option value="">전체 공개 범위</option>
          <option value="class">수업 공개</option>
          <option value="public">모두 공개</option>
          <option value="private">비공개</option>
        </select>
        <input type="text" id="filter-text" placeholder="제목·이름으로 검색…" style="flex:1 1 180px; max-width:260px">
        <button class="btn btn--ghost btn--sm" type="button" id="export">CSV 내려받기</button>
      </div>

      <p class="small muted" id="admin-status" aria-live="polite"></p>
      <div class="gallery-grid" id="admin-works"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/works.js"></script>
<script src="assets/js/admin-activities.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
