<!DOCTYPE html>

<head>

</head>
<body>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="index.html">박주현<small>전남대학교 문헌정보학과</small></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="메뉴 열기">☰</button>
    <nav class="nav" id="nav">
      <a href="about.html">소개</a>
      <a href="research.html">연구</a>
      <a href="courses.html">수업</a>
      <a href="media.html">미디어</a>
      <a href="gallery.html">결과물</a>
      <a href="surveys.html">설문</a>
      <a href="resources.html">자료실</a>
      <a href="bk21.html">BK21</a>
      <a href="en.html" class="nav-en" lang="en" aria-label="English">EN</a>
      <button class="theme-toggle" type="button"></button>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="wrap">
      <p class="eyebrow">RESOURCES</p>
      <h1 style="font-family:var(--font-serif)">자료실</h1>
      <nav class="res-tabs" aria-label="자료실 메뉴">
        <a href="resources.html" aria-current="page">자료 목록</a>
        <a href="booklists.html">권장도서목록</a>
      </nav>
      <p style="max-width:58ch; font-size:1.05rem; color:var(--ink-soft)">
        문헌정보학 교육과 학과 운영에 참고할 분석 자료를 모아 둡니다.
        새 자료가 위에 옵니다.
      </p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="grid grid-2" id="res-list"><p class="muted">불러오는 중…</p></div>
    </div>
  </section>

  <!-- 수강생 전용 자료: 서버에 자료가 있을 때만 나타납니다 (assets/js/materials.js) -->
  <section class="section" id="members-section" style="padding-top:0" hidden>
    <div class="wrap">
      <h2 style="font-family:var(--font-serif); font-size:1.45rem; margin-bottom:.3rem">수강생 전용 자료</h2>
      <p class="small" style="max-width:62ch; color:var(--ink-soft); margin-bottom:1.2rem">
        수업이나 연수에서 안내받은 코드를 넣으면 파일을 내려받을 수 있습니다.
        한 번 넣으면 이 브라우저가 기억합니다. 받은 자료는 수업 밖으로 퍼뜨리지 말아 주세요.
      </p>
      <div class="grid grid-2" id="members-list"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/common.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/materials.js"></script>
<script>
(function () {
  const fmtDate = (d) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    return m ? `${+m[1]}. ${+m[2]}. ${+m[3]}.` : '';
  };

  fetch('data/resources.json')
    .then((r) => r.json())
    .then((data) => {
      const list = (data.resources || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      document.getElementById('res-list').innerHTML = list.length
        ? list.map(card).join('')
        : '<p class="muted">아직 올린 자료가 없습니다.</p>';
    })
    .catch(() => {
      document.getElementById('res-list').innerHTML = '<p class="muted">자료 목록을 불러오지 못했습니다.</p>';
    });

  function card(r) {
    const outside = /^https?:/.test(r.url || '');
    return `
    <article class="card course-card">
      <span class="course-card__term">${esc(r.category || '자료')}</span>
      <h3 class="course-card__title">${esc(r.title)}</h3>
      <p class="small muted" style="margin:0">${esc(fmtDate(r.date))}</p>
      <p class="small" style="margin:.4rem 0 0; color:var(--ink-soft)">${esc(r.summary || '')}</p>
      <div class="course-card__links">
        <a class="btn btn--sm" href="${esc(r.url)}"${outside ? ' target="_blank" rel="noopener"' : ''}>자료 보기</a>
      </div>
    </article>`;
  }
})();
</script>
</body>
</html>
