<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f0e8">
<title>마감 10분 전</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fbf8f1;
    --ink: #242820;
    --muted: #5d655b;
    --green: #315b49;
    --green-dark: #244638;
    --line: #d8d4c9;
    --warm: #eee7d8;
    --red: #873f38;
  }
  * { box-sizing: border-box; }
  html { min-width: 320px; background: var(--paper); }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  button { font: inherit; }
  .shell {
    width: min(100%, 620px);
    min-height: 100svh;
    margin: 0 auto;
    padding: 18px 18px 22px;
    display: flex;
    flex-direction: column;
  }
  header { padding: 8px 2px 16px; }
  .eyebrow {
    margin: 0 0 4px;
    color: var(--green);
    font-size: 16px;
    font-weight: 750;
    letter-spacing: .04em;
  }
  h1 {
    margin: 0;
    font-size: clamp(27px, 8vw, 34px);
    line-height: 1.25;
    letter-spacing: -.045em;
  }
  .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 16px; }
  .status {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    margin: 2px 0 18px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: #fffdf8;
  }
  .status-label { display: block; color: var(--muted); font-size: 16px; }
  .clock { font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .progress-wrap { margin-top: 5px; height: 7px; overflow: hidden; border-radius: 99px; background: #e8e3d8; }
  .progress { height: 100%; width: 0; background: var(--green); transition: width .2s ease; }
  .deadline { text-align: right; color: var(--red); font-size: 16px; font-weight: 750; }
  main { flex: 1; }
  .scene-card {
    padding: 19px 17px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #fffdf8;
    box-shadow: 0 5px 18px rgba(44, 42, 33, .045);
  }
  .scene-kicker { margin: 0 0 5px; color: var(--green); font-size: 16px; font-weight: 750; }
  h2 { margin: 0 0 12px; font-size: 23px; line-height: 1.35; letter-spacing: -.025em; }
  .location { margin: -5px 0 15px; color: var(--muted); font-size: 16px; }
  .story p { margin: 0 0 12px; }
  .story p:last-child { margin-bottom: 0; }
  .dialogue {
    margin: 14px 0;
    padding: 12px 14px;
    border-left: 4px solid var(--green);
    border-radius: 0 10px 10px 0;
    background: #f1f3ec;
  }
  .speaker { display: block; margin-bottom: 3px; color: var(--green-dark); font-size: 16px; font-weight: 800; }
  .choices { display: grid; gap: 10px; margin-top: 19px; }
  .choice {
    width: 100%;
    min-height: 58px;
    padding: 12px 14px;
    text-align: left;
    color: var(--ink);
    border: 1.5px solid #9ca99d;
    border-radius: 13px;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .choice:focus-visible, .primary:focus-visible, .secondary:focus-visible {
    outline: 3px solid #c18b36;
    outline-offset: 3px;
  }
  .choice:active { background: #eef2eb; }
  .choice-text { font-weight: 700; }
  .cost { flex: 0 0 auto; color: var(--muted); font-size: 16px; white-space: nowrap; }
  .note {
    margin: 13px 1px 0;
    color: var(--muted);
    font-size: 16px;
  }
  .log {
    margin-top: 15px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--warm);
  }
  .log h3 { margin: 0 0 5px; font-size: 16px; }
  .log p { margin: 0; color: #41473f; font-size: 16px; }
  .ending {
    padding: 18px 16px;
    border-radius: 15px;
    background: #f1f3ec;
    border: 1px solid #cbd5ca;
  }
  .ending h3 { margin: 0 0 8px; font-size: 22px; }
  .ending p { margin: 0 0 10px; }
  .ending p:last-child { margin-bottom: 0; }
  .ending.late { background: #f6efeb; border-color: #ddc7bf; }
  .ending.incomplete { background: #f5f1e7; border-color: #dfd2b6; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .primary, .secondary {
    min-height: 52px;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 750;
  }
  .primary { color: white; border: 1px solid var(--green); background: var(--green); }
  .secondary { color: var(--green-dark); border: 1px solid #9ca99d; background: white; }
  footer {
    margin-top: 22px;
    padding: 14px 2px 2px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 16px;
    text-align: center;
  }
  @media (max-width: 380px) {
    .shell { padding: 14px 13px 18px; }
    .scene-card { padding: 17px 14px; }
    .status { padding: 11px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <p class="eyebrow">짧은 텍스트 어드벤처</p>
    <h1>마감 10분 전</h1>
    <p class="subtitle">대학도서관 · 오늘의 마감 22:00</p>
  </header>

  <section class="status" aria-label="게임 진행 상황">
    <div>
      <span class="status-label">현재 시각</span>
      <div class="clock" id="clock" aria-live="polite">21:50</div>
      <div class="progress-wrap" aria-hidden="true"><div class="progress" id="progress"></div></div>
    </div>
    <div class="deadline">
      <span class="status-label">남은 시간</span>
      <span id="remaining">10분</span>
    </div>
  </section>

  <main id="game" aria-live="polite">
    <section class="scene-card">
      <p class="scene-kicker">시작</p>
      <h2>마지막 확인</h2>
      <div class="story">
        <p>21시 50분. 대학도서관 마감까지 10분 남았다.</p>
        <p>반납함에서 책 한 권이 보이지 않는다는 연락이 왔다. 서윤은 마지막으로 도서관 안을 확인하기로 한다.</p>
        <p>책을 찾을 수 있을까?</p>
      </div>
      <div class="actions">
        <button class="primary" id="startButton" type="button">시작하기</button>
      </div>
    </section>
  </main>

  <footer>실습자 × AI 공동작업. 등장인물과 책 제목은 모두 지어낸 것입니다.</footer>
</div>

<script>
(() => {
  "use strict";

  const state = {
    minute: 50,
    scene: 0,
    memoSeen: false,
    memoShared: false,
    memoPhotographed: false,
    routeRecorded: false,
    bookFound: false,
    ended: false,
    history: []
  };

  const game = document.getElementById("game");
  const clock = document.getElementById("clock");
  const remaining = document.getElementById("remaining");
  const progress = document.getElementById("progress");

  const scenes = {
    1: {
      kicker: "1장면 · 1층 대출반납대",
      title: "사라진 책",
      location: "21:50 · 1층 대출반납대",
      body: `
        <p>마감 10분 전. 한정은이 반납 기록을 확인하다 서윤을 부른다.</p>
        <div class="dialogue"><span class="speaker">한정은</span>“목록에는 있는데요. 『바다를 건너는 지도』가 반납함에는 보이지 않네요.”</div>
        <p>서윤은 반납함을 다시 살핀다. 책은 보이지 않는다.</p>
        <div class="dialogue"><span class="speaker">서윤</span>“제가 찾아볼게요. 마감 전에 확인하겠습니다.”</div>
        <p>어디부터 확인하는 게 좋을까?</p>`,
      choices: [
        { label: "반납 기록을 먼저 본다", cost: 2, next: 2, effect: () => { state.memoSeen = true; } },
        { label: "바로 3층으로 올라간다", cost: 3, next: 3, effect: () => { state.memoSeen = false; } }
      ]
    },
    2: {
      kicker: "2장면 · 반납 기록 앞",
      title: "손글씨 메모",
      location: "반납 기록 앞",
      body: `
        <p>반납 기록 옆에 손글씨 메모가 붙어 있다.</p>
        <div class="dialogue">“3층 반납 카트로 옮김”</div>
        <p>누가 쓴 메모인지는 알 수 없다. 서윤은 내용을 확인하고 다음 행동을 고민한다.</p>
        <p>메모를 어떻게 남길까?</p>`,
      choices: [
        { label: "한정은에게 메모를 보여 준다", cost: 2, next: 3, effect: () => { state.memoShared = true; } },
        { label: "메모를 사진으로만 남기고 올라간다", cost: 1, next: 3, effect: () => { state.memoPhotographed = true; } }
      ]
    },
    3: {
      kicker: "3장면 · 3층 열람실",
      title: "열람실의 목격자",
      location: "3층 열람실",
      body: `
        <p>3층 열람실에는 도윤이 혼자 남아 있다. 서윤은 도윤에게 파란 표지 책을 본 적이 있는지 묻는다.</p>
        <div class="dialogue"><span class="speaker">도윤</span>“서고 끝 책상에서 파란 표지 책을 봤어. 제목은 못 봤는데.”</div>
        <p>도윤은 책 제목을 모른다. 서윤은 들은 내용을 바탕으로 다음 행동을 정한다.</p>`,
      choices: [
        { label: "사정을 차분히 설명한다", cost: 2, next: 4, effect: () => {} },
        { label: "카트부터 직접 뒤진다", cost: 3, next: 4, effect: () => {} }
      ]
    },
    4: {
      kicker: "4장면 · 3층 서고 끝",
      title: "마감 10분 전",
      location: "3층 서고 끝",
      body: `
        <p>서고 끝에 도착했다. 책상과 반납 카트를 차례로 살핀다.</p>
        <p>파란 표지 책이 눈에 들어온다. 서윤은 표지를 확인하려 한다. 찾으려던 책인지 확인하고, 발견 경로를 남길지 결정해야 한다.</p>
        <p>책을 확인하고 경로까지 기록할지, 우선 책만 회수할지 결정해야 한다.</p>`,
      choices: [
        { label: "책을 확인하고 발견 경로까지 기록한다", cost: 3, next: "finish-record", effect: () => { state.routeRecorded = true; state.bookFound = true; } },
        { label: "시간을 아껴 책을 확인하고 회수한다", cost: 1, next: "finish-quick", effect: () => { state.bookFound = true; } }
      ]
    }
  };

  function currentMinute() {
    return state.minute;
  }

  function formatTime(minute) {
    if (minute >= 60) return "22:00";
    return "21:" + String(minute).padStart(2, "0");
  }

  function updateStatus() {
    const elapsed = Math.max(0, currentMinute() - 50);
    const left = Math.max(0, 10 - elapsed);
    clock.textContent = formatTime(currentMinute());
    remaining.textContent = left + "분";
    progress.style.width = Math.min(100, elapsed * 10) + "%";
  }

  function addLog(message) {
    state.history.push(message);
  }

  function renderScene(number) {
    state.scene = number;
    const scene = scenes[number];
    game.innerHTML = `
      <section class="scene-card">
        <p class="scene-kicker">${scene.kicker}</p>
        <h2>${scene.title}</h2>
        <p class="location">${scene.location}</p>
        <div class="story">${scene.body}</div>
        <div class="choices" id="choices">
          ${scene.choices.map((choice, index) => `
            <button class="choice" type="button" data-choice="${index}">
              <span class="choice-text">${index === 0 ? "① " : "② "}${choice.label}</span>
              <span class="cost">${choice.cost}분</span>
            </button>`).join("")}
        </div>
        <p class="note">선택하면 시간이 흐릅니다. 22:00이 되기 전에 행동을 마쳐야 합니다.</p>
      </section>
      <section class="log" aria-label="진행 기록">
        <h3>확인한 내용</h3>
        <p>${state.memoSeen ? "반납 기록의 손글씨 메모를 확인했다." : "반납 기록의 메모는 아직 확인하지 않았다."}</p>
        <p>${state.memoShared ? "한정은과 메모를 공유했다." : state.memoPhotographed ? "메모를 사진으로 남겼다." : "메모를 공유하거나 촬영하지 않았다."}</p>
      </section>`;

    game.querySelectorAll("[data-choice]").forEach(button => {
      button.addEventListener("click", () => {
        const choice = scene.choices[Number(button.dataset.choice)];
        takeChoice(choice);
      });
    });
    updateStatus();
  }

  function takeChoice(choice) {
    if (state.ended) return;

    const finishChoice =
      choice.next === "finish-record" ||
      choice.next === "finish-quick";

    const arrival = state.minute + choice.cost;

    // 행동이 끝나기 전에 22:00이 되면 마감이다.
    if (arrival >= 60) {
      state.minute = 60;
      updateStatus();
      endGame("late");
      return;
    }

    state.minute = arrival;
    choice.effect();
    addLog(choice.label);

    if (finishChoice) {
      endGame("found");
      return;
    }

    renderScene(choice.next);
  }

  function endGame(kind) {
    state.ended = true;
    updateStatus();

    if (kind === "late") {
      game.innerHTML = `
        <section class="scene-card">
          <p class="scene-kicker">마지막 장면 · 22:00</p>
          <h2>도서관 마감</h2>
          <div class="ending late">
            <h3>내일 다시 확인하기로 했다</h3>
            <p>책을 찾는 행동을 마치기 전에 22시가 되었다. 오늘은 더 확인할 수 없다.</p>
            <p>서윤은 내일 다시 살펴보기로 한다. 책을 옮긴 사람이 누구인지는 여전히 알 수 없다.</p>
          </div>
          <div class="actions"><button class="secondary" id="restart" type="button">처음부터 다시 하기</button></div>
        </section>`;
    } else {
      const hasEvidence = state.memoShared || state.memoPhotographed;
      const enoughRecord = hasEvidence && state.routeRecorded;
      const endingClass = enoughRecord ? "" : " incomplete";
      const heading = enoughRecord ? "책을 찾았다. 경로도 남겼다." : "책은 찾았지만 기록이 부족하다.";
      const detail = enoughRecord
        ? "메모를 공유하거나 사진으로 남겼고, 마지막에 발견 경로도 기록했다. 다음에 확인할 사람이 참고할 수 있는 단서가 남았다."
        : "책은 회수했다. 하지만 메모를 공유하거나 사진으로 남기지 않았거나, 발견 경로를 기록하지 않아 확인 과정이 충분히 남지 않았다.";

      game.innerHTML = `
        <section class="scene-card">
          <p class="scene-kicker">4장면 · 3층 서고 끝</p>
          <h2>찾았다</h2>
          <div class="ending${endingClass}">
            <h3>${heading}</h3>
            <p>${detail}</p>
            <p>서윤은 책을 확인한다. 누가 책을 옮겼는지는 끝내 밝혀지지 않는다.</p>
          </div>
          <div class="log">
            <h3>마지막 기록</h3>
            <p>메모 확인: ${state.memoSeen ? "함" : "하지 않음"}</p>
            <p>한정은과 공유: ${state.memoShared ? "함" : "하지 않음"}</p>
            <p>사진 촬영: ${state.memoPhotographed ? "함" : "하지 않음"}</p>
            <p>발견 경로 기록: ${state.routeRecorded ? "함" : "하지 않음"}</p>
            <p>완료 시각: ${formatTime(state.minute)}</p>
          </div>
          <div class="actions"><button class="secondary" id="restart" type="button">처음부터 다시 하기</button></div>
        </section>`;
    }

    const restart = document.getElementById("restart");
    if (restart) restart.addEventListener("click", resetGame);
  }

  function resetGame() {
    state.minute = 50;
    state.scene = 0;
    state.memoSeen = false;
    state.memoShared = false;
    state.memoPhotographed = false;
    state.routeRecorded = false;
    state.bookFound = false;
    state.ended = false;
    state.history = [];
    updateStatus();

    game.innerHTML = `
      <section class="scene-card">
        <p class="scene-kicker">시작</p>
        <h2>마지막 확인</h2>
        <div class="story">
          <p>21시 50분. 대학도서관 마감까지 10분 남았다.</p>
          <p>반납함에서 책 한 권이 보이지 않는다는 연락이 왔다. 서윤은 마지막으로 도서관 안을 확인하기로 한다.</p>
          <p>책을 찾을 수 있을까?</p>
        </div>
        <div class="actions"><button class="primary" id="startButton" type="button">시작하기</button></div>
      </section>`;
  }

  // 수정: 시작 버튼은 상위 game 영역에서 클릭을 감지한다.
  // 버튼 DOM이 다시 만들어져도 이벤트 연결이 유지된다.
  game.addEventListener("click", (event) => {
    const target = event.target;
    if (!(target instanceof Element)) return;

    const startButton = target.closest("#startButton");

    if (startButton && game.contains(startButton)) {
      renderScene(1);
    }
  });

  updateStatus();
})();
</script>
</body>
</html>
